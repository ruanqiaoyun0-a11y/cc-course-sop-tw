let drillRoundIdx = 0;   // 当前轮次
let drillPicks = [];     // 当前场景每轮首次选择的选项索引
let drillActive = false; // 场景是否已开始

function renderOfflineOptions(retryMode) {
  const stage = offlineDrillScenes[drillCurrentScene];
  const round = stage.rounds[drillRoundIdx];
  return '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">' + round.options.map(function(o,i){
    const picked = retryMode && drillPicks[drillRoundIdx] === i;
    return '<button class="btn btn-outline" style="text-align:left;white-space:normal;' + (picked?'opacity:0.45;text-decoration:line-through;':'') + '" ' + (picked?'disabled':'') + ' onclick="pickOfflineOption(' + i + ')"><b>话术 ' + 'ABCD'[i] + '：</b>' + o.text + '</button>';
  }).join('') + '</div>';
}

function renderOfflineRound() {
  const stage = offlineDrillScenes[drillCurrentScene];
  const round = stage.rounds[drillRoundIdx];
  const chat = document.getElementById('drillChatArea');
  const opts = document.getElementById('drillOptionsArea');
  const fb = document.getElementById('drillFeedbackArea');
  const nav = document.getElementById('drillStageNav');
  let log = '<div style="padding:14px;background:#f8fafc;border-radius:10px;margin-bottom:12px;"><h3 style="margin-bottom:6px;">' + stage.label + ' · 第 ' + (drillRoundIdx+1) + ' / ' + stage.rounds.length + ' 轮</h3><p style="font-size:13px;color:var(--text-secondary);line-height:1.8;">' + stage.scenario + '</p></div>';
  for (let r = 0; r <= drillRoundIdx; r++) {
    const rd = stage.rounds[r];
    log += '<div class="chat-msg parent"><div class="chat-avatar">家</div><div class="chat-content"><div class="chat-label">家长</div><div class="chat-bubble">' + rd.parent + '</div></div></div>';
    const pick = drillPicks[r];
    if (pick !== undefined) {
      const chosen = rd.options[pick];
      const mark = pick === rd.best ? ' ✓' : ' ✗';
      log += '<div class="chat-msg cc"><div class="chat-avatar">CC</div><div class="chat-content"><div class="chat-label">课程顾问 · CC（你的选择' + mark + '）</div><div class="chat-bubble">' + chosen.text + '</div></div></div>';
    }
  }
  if (drillPicks[drillRoundIdx] === undefined) {
    log += '<div class="chat-msg system" style="justify-content:center"><div class="chat-bubble">👆 请从下面选出你的下一句话（首次选择计入得分）</div></div>';
  }
  chat.innerHTML = log;
  if (drillPicks[drillRoundIdx] === undefined) {
    opts.innerHTML = renderOfflineOptions(false);
    fb.innerHTML = ''; nav.innerHTML = '';
    return;
  }
  const pickedOpt = round.options[drillPicks[drillRoundIdx]];
  const isBest = !!(pickedOpt && pickedOpt.best);
  if (isBest) {
    fb.innerHTML = '<div style="margin-top:10px;padding:12px;background:#ecfdf5;border-radius:10px;border-left:4px solid #059669;"><strong>✅ 选对了</strong><p style="margin-top:6px;font-size:13px;line-height:1.8;">' + round.options[drillPicks[drillRoundIdx]].fb + '</p></div>';
    if (drillRoundIdx + 1 < stage.rounds.length) {
      opts.innerHTML = '<button class="btn" style="margin-top:10px;" onclick="nextOfflineRound()">➡️ 下一轮</button>';
      nav.innerHTML = '';
    } else {
      opts.innerHTML = ''; nav.innerHTML = '';
      finishOfflineScene();
    }
  } else {
    opts.innerHTML = renderOfflineOptions(true);
    fb.innerHTML = '<div style="margin-top:10px;padding:12px;background:#fef2f2;border-radius:10px;border-left:4px solid #ef4444;"><strong>❌ 这句话不太合适</strong><p style="margin-top:6px;font-size:13px;line-height:1.8;">' + round.options[drillPicks[drillRoundIdx]].fb + '</p><p style="font-size:12px;color:var(--text-secondary);margin-top:6px;">首次选择已计入得分——再从剩下的选项里选一次，看家长会怎么回应。</p></div>';
    nav.innerHTML = '';
  }
}

function pickOfflineOption(oi) {
  const stage = offlineDrillScenes[drillCurrentScene];
  if (drillPicks[drillRoundIdx] === undefined) drillPicks[drillRoundIdx] = oi;
  saveProgress();
  renderOfflineRound();
}

function nextOfflineRound() {
  drillRoundIdx++;
  saveProgress();
  renderOfflineRound();
}

function finishOfflineScene() {
  const stage = offlineDrillScenes[drillCurrentScene];
  const best = drillPicks.filter(function(p, r){ var o = stage.rounds[r] && stage.rounds[r].options[p]; return !!(o && o.best); }).length;
  const score = Math.round(best / stage.rounds.length * 100);
  drillSceneScores[drillCurrentScene] = Math.max(drillSceneScores[drillCurrentScene] || 0, score);
  if (score >= DRILL_PASS_SCORE) drillSceneDone[drillCurrentScene] = true;
  saveProgress();
  const chat = document.getElementById('drillChatArea');
  const opts = document.getElementById('drillOptionsArea');
  const fb = document.getElementById('drillFeedbackArea');
  const nav = document.getElementById('drillStageNav');
  const pass = drillSceneDone[drillCurrentScene];
  chat.innerHTML = '<div style="text-align:center;padding:20px;"><div class="score-circle ' + (score>=80?'high':pass?'medium':'low') + '" style="width:90px;height:90px;font-size:34px;margin:0 auto;">' + score + '</div><p style="margin-top:10px;font-size:16px;font-weight:700;">' + stage.label + '：' + (score>=80?'优秀':pass?'通过':'未通过') + '（' + best + '/' + stage.rounds.length + ' 轮首次即选对）</p><p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">' + (pass ? '✅ ≥' + DRILL_PASS_SCORE + '分，本关通过！' : '❌ 未达' + DRILL_PASS_SCORE + '分，建议重做本关加深印象') + '</p></div>';
  opts.innerHTML = ''; fb.innerHTML = '';
  const nextIdx = drillCurrentScene + 1;
  nav.innerHTML = '<button class="btn btn-outline" onclick="resetDrillScene()">🔄 重做本关</button>' + (nextIdx < offlineDrillScenes.length ? ' <button class="btn" onclick="switchDrillScene(' + nextIdx + ')" ' + (drillSceneDone[drillCurrentScene] ? '' : 'disabled') + '>➡️ 下一关</button>' : '');
}

function updateDrillUI() {
  const prog = document.getElementById('drillProgress');
  if (!prog) return;
  prog.innerHTML = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">' + offlineDrillScenes.map(function(s, i){
    const done = drillSceneDone[i], cur = i === drillCurrentScene, unlocked = i === 0 || drillSceneDone[i-1];
    const bg = done ? '#059669' : cur ? 'var(--primary)' : unlocked ? '#f1f5f9' : '#e2e8f0';
    const col = (done || cur) ? '#fff' : '#64748b';
    const score = drillSceneScores[i] > 0 ? ' <span style="font-size:10px;">' + drillSceneScores[i] + '分</span>' : '';
    const click = unlocked ? 'onclick="switchDrillScene(' + i + ')" style="cursor:pointer;' : 'style="cursor:default;';
    return '<span ' + click + 'background:' + bg + ';color:' + col + ';padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;">第' + (i+1) + '关 ' + s.short + score + (done ? ' ✓' : '') + '</span>';
  }).join('') + '</div>';
  const stage = offlineDrillScenes[drillCurrentScene];
  const chat = document.getElementById('drillChatArea');
  const opts = document.getElementById('drillOptionsArea');
  const fb = document.getElementById('drillFeedbackArea');
  const nav = document.getElementById('drillStageNav');
  const assess = document.getElementById('drillAssessmentArea');
  if (!drillActive) {
    chat.innerHTML = '<div style="padding:16px;background:#f8fafc;border-radius:10px;"><h3 style="margin-bottom:8px;">' + stage.label + '</h3><p style="font-size:14px;line-height:1.8;">' + stage.scenario + '</p><div class="highlight-box" style="margin-top:10px;"><strong>🎯 目标：</strong>' + stage.objective + '</div><p style="font-size:12px;color:var(--text-secondary);margin-top:8px;">共 ' + stage.rounds.length + ' 轮，每轮从候选话术中选出最合适的一句（首次选择计入得分，选错可再选但会扣分）。</p></div>';
    opts.innerHTML = ''; fb.innerHTML = '';
    nav.innerHTML = '<button class="btn" id="drillStartBtn" onclick="startDrillScene()">🎬 开始练习</button>' + (drillSceneDone[drillCurrentScene] ? ' <span style="color:#059669;font-weight:600;font-size:13px;">本关已通过（' + drillSceneScores[drillCurrentScene] + '分），可重做刷新成绩</span>' : '');
  } else {
    renderOfflineRound();
  }
  const allDone = drillSceneDone.every(function(d){ return d; });
  if (allDone) {
    assess.style.display = 'block';
    if (!drillAssessmentSubmitted) computeOfflineAssessment();
    renderOfflineAssessment();
  } else {
    assess.style.display = 'none';
  }
}

function startDrillScene() {
  drillActive = true; drillRoundIdx = 0; drillPicks = [];
  saveProgress(); updateDrillUI(); renderOfflineRound();
}
function resetDrillScene() {
  drillActive = false; drillRoundIdx = 0; drillPicks = [];
  drillSceneScores[drillCurrentScene] = 0;
  drillSceneDone[drillCurrentScene] = false;
  drillAssessmentSubmitted = false; drillAssessmentScore = 0;
  saveProgress(); updateDrillUI();
}
function switchDrillScene(idx) {
  drillCurrentScene = idx; drillActive = false; drillRoundIdx = 0; drillPicks = [];
  saveProgress(); updateDrillUI();
}
function computeOfflineAssessment() {
  const sum = drillSceneScores.reduce(function(a, b){ return a + (b || 0); }, 0);
  drillAssessmentScore = Math.round(sum / offlineDrillScenes.length);
  drillAssessmentSubmitted = true;
}
function renderOfflineAssessment() {
  const area = document.getElementById('drillAssessmentArea'); if (!area) return;
  const pass = drillIsPassed();
  const detail = offlineDrillScenes.map(function(s, i){
    return '<span style="display:inline-block;background:' + (drillSceneDone[i] ? '#dcfce7' : '#fee2e2') + ';padding:4px 10px;border-radius:6px;margin:3px 4px 3px 0;font-size:12px;">第' + (i+1) + '关 ' + (drillSceneScores[i] || 0) + '分</span>';
  }).join('');
  area.innerHTML = '<p style="font-size:15px;font-weight:700;color:' + (pass ? '#065f46' : '#991b1b') + ';">📊 综合考核（6关平均）：' + drillAssessmentScore + ' 分（' + (pass ? '✅ 通过，第3章已解锁！' : '❌ 未达标（需≥' + DRILL_PASS_SCORE + '分）') + '）</p><div style="margin-top:8px;">' + detail + '</div><button class="btn btn-outline" onclick="resetDrillScene()" style="margin-top:10px;">🔄 重做当前关</button>';
}
function submitDrillAssessment() {
  computeOfflineAssessment(); saveProgress(); renderOfflineAssessment();
  if (typeof showToast === 'function') showToast('综合考核得分：' + drillAssessmentScore + ' 分' + (drillIsPassed() ? '，已解锁下一章！' : '，未达标可重做关卡'), drillIsPassed() ? 'success' : 'warning');
}
function endDrillScene() { /* 离线模式自动结算，无此操作 */ }

// Keyboard// Keyboard
function setupQuizListeners() {
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      const fi = document.getElementById('rpInput');
      if (fi && document.activeElement === fi && !fi.disabled) submitRoleplayMessage();
    }
  });
}

// Timer
function startTimer() {
  const saved = localStorage.getItem(LS_PREFIX+'_study_seconds');
  if (saved) studySeconds = parseInt(saved);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    studySeconds++;
    updateTimerDisplay();
    if (studySeconds % 10 === 0) localStorage.setItem(LS_PREFIX+'_study_seconds', studySeconds);
  }, 1000);
}
function updateTimerDisplay() {
  const mins = Math.floor(studySeconds/60), secs = studySeconds%60;
  const ts = String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  const el = document.getElementById('timerDisplay'); if (el) el.textContent = ts;
  const mt = document.getElementById('mhTimer'); if (mt) mt.textContent = '⏱ '+ts;
}

// Notes
function toggleNotes() { document.getElementById('notesPanel').classList.toggle('open'); }
function updateNotesForSection(index) {
  document.getElementById('notesChapterLabel').textContent = courseData.sections[index].title;
  const saved = JSON.parse(localStorage.getItem(LS_PREFIX+'_notes')||'{}');
  document.getElementById('notesTextarea').value = saved[index]||'';
}
function loadNotes() {
  const saved = JSON.parse(localStorage.getItem(LS_PREFIX+'_notes')||'{}');
  const ta = document.getElementById('notesTextarea');
  if (ta) {
    ta.value = saved[currentSection]||'';
    ta.addEventListener('input', function() {
      const all = JSON.parse(localStorage.getItem(LS_PREFIX+'_notes')||'{}');
      all[currentSection] = this.value;
      localStorage.setItem(LS_PREFIX+'_notes', JSON.stringify(all));
    });
  }
}

// Progress persistence
function saveProgress() {
  const state = { completedSections: [...completedSections], chapterQuizDone, chapterQuizAnswers, finalTaskSubmitted, finalScore, roleplaySubmitted, roleplayScore, roleplayExchangeCount, roleplayConversation, drillCurrentScene, drillSceneDone, drillSceneScores, drillExchangeCount, drillConversation, drillSceneConversations, drillAssessmentSubmitted, drillAssessmentScore, currentSection };
  localStorage.setItem(LS_PREFIX+'_progress', JSON.stringify(state));
}
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_PREFIX+'_progress'));
    if (saved) {
      completedSections = new Set(saved.completedSections||[]);
      chapterQuizDone = saved.chapterQuizDone || [false,false,false,false,false,false];
      // 旧数据迁移：chapterQuizDone 有 true 但无 chapterQuizAnswers → 重置
      if (chapterQuizDone.some(d => d) && (!saved.chapterQuizAnswers || Object.keys(saved.chapterQuizAnswers).length === 0)) {
        chapterQuizDone = [false,false,false,false,false,false];
      }
      if (saved.chapterQuizAnswers) Object.assign(chapterQuizAnswers, saved.chapterQuizAnswers);
      finalTaskSubmitted = saved.finalTaskSubmitted||false; finalScore = saved.finalScore||0;
      roleplaySubmitted = saved.roleplaySubmitted || finalTaskSubmitted || false;
      roleplayScore = saved.roleplayScore || finalScore || 0;
      roleplayExchangeCount = saved.roleplayExchangeCount || 0;
      roleplayConversation = saved.roleplayConversation || [];
      drillCurrentScene = saved.drillCurrentScene || 0;
      drillSceneDone = saved.drillSceneDone || [false,false,false,false,false,false];
      drillSceneScores = saved.drillSceneScores || [0,0,0,0,0,0];
      drillExchangeCount = saved.drillExchangeCount || 0;
      drillConversation = saved.drillConversation || [];
      drillSceneConversations = saved.drillSceneConversations || [[],[],[],[],[],[]];
      drillAssessmentSubmitted = saved.drillAssessmentSubmitted || false;
      drillAssessmentScore = saved.drillAssessmentScore || 0;
      if (saved.currentSection !== undefined) currentSection = saved.currentSection;
      // 验证 currentSection 可达性
      const navCheck = canNavigateTo(currentSection);
      if (!navCheck.ok) currentSection = 0;
      updateProgress(); updateSidebarLocks();
      // 恢复章节选择题 UI
      restoreChapterQuizUI();
      if (roleplaySubmitted) {
        // 嘗試恢復反饋區域（如果有）
        const fb = document.getElementById('rpFeedback');
        if (fb && roleplayScore) {
          // 用基本資料重建反饋（不重建 JSON 細節，僅顯示分數與重做按鈕）
          const scoreClass = roleplayScore >= 80 ? 'high' : roleplayScore >= 60 ? 'medium' : 'low';
          const scoreLabel = roleplayScore >= 80 ? '優秀' : roleplayScore >= 60 ? '通過' : '未通過';
          fb.innerHTML = `<div class="score-display"><div class="score-circle ${scoreClass}" style="width:80px;height:80px;font-size:32px;">${roleplayScore}</div><p style="margin-top:8px;font-size:16px;font-weight:700;">${scoreLabel}（滿分100分）</p><p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">（历史记录已载入，可重新作答覆盖）</p></div><div style="margin-top:20px;text-align:center;"><button class="btn" onclick="resetRoleplay()" style="min-width:180px;">🔄 重新作答</button></div>`;
          fb.style.display = 'block';
          const content = document.getElementById('rpContent');
          if (content) content.style.display = 'none';
        }
      }
      // 导航到上次所在章节
      navigateTo(currentSection);
      // 恢复 AI 对话模拟练习 UI（进度条/标注/综合考核区）
      if (typeof updateDrillUI === 'function') updateDrillUI();
    } else {
      navigateTo(0);
    }
  } catch(e) {
    navigateTo(0);
  }
}

// Certificate
function checkCertificate() {
  const allDone = completedSections.size >= courseData.sections.length && finalTaskSubmitted && finalScore >= 60;
  if (!allDone) return false;
  if (allDone) {
    setTimeout(() => {
      showToast('🏆 恭喜完成全部课程！点击领取结业证书', 'success');
      document.getElementById('certStudentName').textContent = '请填写姓名';
      document.getElementById('certScore').textContent = '综合评定：通过';
      document.getElementById('certFinalScore').textContent = '终极考核得分：'+finalScore+' 分';
      document.getElementById('certDate').textContent = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
      document.getElementById('certOverlay').style.display = 'flex';
    }, 1000);
  }
  return allDone;
}
function closeCertificate() { document.getElementById('certOverlay').style.display = 'none'; }
function printCertificate() {
  const cert = document.getElementById('certPaper');
  const win = window.open('','_blank','width=750,height=600');
  win.document.write('<html><head><meta charset="UTF-8"><title>结业证书</title><style>');
  win.document.write('body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f1f5f9;}');
  win.document.write('.cert{background:#fff;width:700px;padding:48px 36px;text-align:center;border:2px solid #e2e8f0;border-radius:12px;}');
  win.document.write('.cert h1{font-size:28px;color:#3730A3;margin-bottom:4px;}');
  win.document.write('.cert .sub{font-size:12px;color:#64748b;letter-spacing:0.1em;margin-bottom:24px;}');
  win.document.write('.cert .body{font-size:15px;line-height:2;color:#1e293b;}');
  win.document.write('.cert .name{display:inline-block;border-bottom:2px solid #4F46E5;min-width:120px;padding:4px 12px;margin:0 4px;}');
  win.document.write('.cert .course{font-weight:700;color:#3730A3;margin:8px 0;}');
  win.document.write('.cert .score{margin:20px 0 4px;font-size:16px;font-weight:600;color:#10b981;}');
  win.document.write('.cert .final-score{margin:4px 0 20px;font-size:14px;font-weight:600;color:#3730A3;}');
  win.document.write('.cert .footer{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-top:32px;border-top:1px solid #e2e8f0;padding-top:16px;}');
  win.document.write('</style></head><body><div class="cert">');
  win.document.write(cert.innerHTML.replace(/<button[^>]*>.*?<\/button>/g,''));
  win.document.write('</div></body></html>');
  win.document.close(); setTimeout(() => win.print(), 500);
}

// Tab switching
function switchTab(btn, panelId) {
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  btn.parentElement.parentElement.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(panelId).classList.add('active');
}

// Toast & Sidebar
function showToast(msg, type) {
  const existing = document.querySelector('.toast'); if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast '+type; toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
document.addEventListener('DOMContentLoaded', init);
</script>
