// 发送消息
async function submitDrillMessage() {
  const input = document.getElementById('drillInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) { if (typeof showToast === 'function') showToast('请输入说话内容', 'warning'); return; }
  input.disabled = true;
  const chat = document.getElementById('drillChatArea');
  chat.innerHTML += `<div class="rp-history-item user">🧑‍🏫 你：${text.replace(/</g,'&lt;')}</div>`;
  chat.scrollTop = chat.scrollHeight;
  drillConversation.push({ role: 'user', content: text });
  drillExchangeCount++;
  const typing = document.getElementById('drillTyping');
  if (typing) typing.style.display = 'flex';
  // 发送按钮实时计时，让用户知道 AI 正在回复（而非卡住）
  const sendBtn = document.getElementById('drillSendBtn');
  const sendStart = Date.now();
  let sendTimer = setInterval(() => {
    if (sendBtn && sendBtn.disabled) {
      const el = Math.floor((Date.now() - sendStart) / 1000);
      sendBtn.textContent = `等待 AI 回复... (${el}s)`;
    } else { clearInterval(sendTimer); }
  }, 1000);
  let parentReply = '好的，请继续。';
  let aiUsed = false;
  try {
    if (!checkStudentLimit()) {
      if (typeof showToast === 'function') showToast('⚠️ 本小时练习次数已达上限，请稍后再试', 'warning');
    } else {
      const backendOK = await checkBackendHealth();
      if (backendOK) {
        try { parentReply = await callDrillParentAI(text); aiUsed = true; }
        catch (err) { console.warn('AI家长回复失败:', err.message); if (typeof showToast === 'function') showToast('⚠️ ' + err.message, 'warning'); }
      } else {
        if (typeof showToast === 'function') showToast('⚠️ AI 服务暂时不可用，本次回复为占位文案。点击「重做本关」可重试', 'warning');
      }
    }
    const label = aiUsed ? '🤖 AI 家长' : '👩 家长（占位回复）';
    chat.innerHTML += `<div class="rp-history-item parent">${label}：${parentReply.replace(/</g,'&lt;')}</div>`;
    chat.scrollTop = chat.scrollHeight;
    drillConversation.push({ role: 'parent', content: parentReply, aiUsed: aiUsed });
  } finally {
    if (typing) typing.style.display = 'none';
    input.value = '';
    input.disabled = false;
    if (sendBtn) { sendBtn.textContent = '发送消息'; sendBtn.disabled = false; }
    input.focus();
    clearInterval(sendTimer);
  }
}

// 调用 AI 获取当前场景家长回复
async function callDrillParentAI(userText) {
  const scene = drillScenes[drillCurrentScene];
  const messages = [ { role: 'system', content: scene.parentSystemPrompt } ];
  const recentCount = Math.min(drillConversation.length - 1, 12);
  const startIdx = Math.max(0, drillConversation.length - 1 - recentCount);
  for (let i = startIdx; i < drillConversation.length - 1; i++) {
    const m = drillConversation[i];
    messages.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content });
  }
  messages.push({ role: 'user', content: userText });
  messages.push({ role: 'system', content: `【立即回应指令】
CC 刚刚讲的是：「${userText.substring(0, 100)}${userText.length > 100 ? '...' : ''}」

请以家长身份，针对这段话做出简短自然的台湾国语回应。
- 听懂了就确认/追问细节
- 没听清就说「不好意思」
- **内容奇怪、乱码、数字串、或明显无意义 → 必须表示困惑：「你说什么？」「我不是很懂你的意思」**
- **绝对不要讲「明白」「哦，知道了」之类敷衍对方**
绝对不要背预设台词！只输出一句话回应。` });
  const data = await callDeepSeek({ messages, model: DEEPSEEK_MODEL, max_tokens: 120, temperature: 0.3 }, 15000);
  let reply = data.choices?.[0]?.message?.content?.trim();
  if (!reply) throw new Error('AI 回应为空');
  reply = reply.replace(/^["「『]|["」』]$/g, '').trim();
  return reply || '好的';
}

// 结束当前场景 & 评分
async function endDrillScene() {
  if (drillExchangeCount < 4) {
    if (typeof showToast === 'function') showToast('⚠️ 对话轮数太少（最少4轮），请继续对话后再结束', 'warning');
    return;
  }
  const endBtn = document.getElementById('drillEndBtn');
  const sendBtn = document.getElementById('drillSendBtn');
  const input = document.getElementById('drillInput');
  if (endBtn) { endBtn.disabled = true; endBtn.textContent = '⏳ AI 评分中... (0s)'; }
  if (sendBtn) sendBtn.disabled = true;
  if (input) input.disabled = true;

  // 实时计时器：让用户看到等待时长（防止以为卡死）
  const startTime = Date.now();
  let timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    if (endBtn && endBtn.disabled) {
      endBtn.textContent = `⏳ AI 评分中... (${elapsed}s)`;
    } else {
      clearInterval(timerInterval);
    }
  }, 1000);

  try { await evaluateDrillScene(); }
  catch (err) {
    console.error('评分失败:', err);
    if (typeof showToast === 'function') showToast('❌ AI 评分失败：' + err.message + '，请点「重做本关」重试', 'error');
    if (endBtn) { endBtn.disabled = false; endBtn.textContent = '🏁 结束本关 & 评分'; }
    if (sendBtn) sendBtn.disabled = false;
    if (input) input.disabled = false;
  } finally {
    clearInterval(timerInterval);
  }
}

async function evaluateDrillScene() {
  const scene = drillScenes[drillCurrentScene];
  drillSceneConversations[drillCurrentScene] = drillConversation.slice(); // 保存本关对话供综合评分
  const conversationText = drillConversation.map(m => `${m.role === 'user' ? '🧑‍🏫 CC' : '👩 AI家长'}：${m.content}`).join('\n');
  const evalMessages = [
    { role: 'system', content: scene.evaluatorSystemPrompt },
    { role: 'user', content: `以下是学员在本场景的对话记录，请进行评分：\n\n${conversationText}\n\n共 ${drillExchangeCount} 轮对话。` }
  ];
  let data;
  try {
    // 18 秒超时：避免长时间等待，更快失败反馈
    data = await callDeepSeek({ messages: evalMessages, model: DEEPSEEK_MODEL, max_tokens: 500, temperature: 0.3 }, 18000);
  } catch (err) {
    console.error('AI 评分请求失败:', err);
    throw err; // 抛到 endDrillScene 的 catch，由那里恢复 UI
  }
  const rawText = data.choices?.[0]?.message?.content?.trim() || '';
  let result;
  try {
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    result = JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
  } catch (e) {
    console.warn('AI评分JSON解析失败，原始返回:', rawText);
    result = { score: 60, process: 18, accuracy: 16, rapport: 17, coverage: 9, feedback: 'AI 评分解析出现问题，已给予基础分数。建议重做以获得准确评分。', strengths: ['完成了对话'], improvements: ['可再详细一些'] };
  }
  const score = Math.min(Math.max(result.score || 0, 0), 100);
  drillSceneScores[drillCurrentScene] = score;
  const passed = score >= DRILL_PASS_SCORE;
  if (passed && !drillSceneDone[drillCurrentScene]) {
    drillSceneDone[drillCurrentScene] = true;
    if (typeof showToast === 'function') showToast('🎉 第' + (drillCurrentScene+1) + '关通过！得分 ' + score + ' 分', 'success');
  } else if (!passed) {
    if (typeof showToast === 'function') showToast('本关得分 ' + score + ' 分，未达 ' + DRILL_PASS_SCORE + ' 分，可重做本关', 'warning');
  }
  renderDrillSceneFeedback(result, score, passed);
  updateDrillUI();
  if (typeof saveProgress === 'function') saveProgress();
}

  const scoreClass = score >= 80 ? 'high' : score >= 70 ? 'medium' : 'low';
  const scoreLabel = score >= 80 ? '优秀' : score >= 70 ? '通过' : '未通过';
  const html = `
    <div class="score-display"><div class="score-circle ${scoreClass}" style="width:80px;height:80px;font-size:32px;">${score}</div><p style="margin-top:8px;font-size:16px;font-weight:700;">${scoreLabel}（满分100分）· 本关：${label}</p><p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${passed ? '✅ 本关已通过！' : '❌ 未达 ' + DRILL_PASS_SCORE + ' 分，点击「重做本关」重新练习'}</p></div>
    <div class="eval-dimensions" style="margin-top:20px;">
      <div class="eval-dim"><h4>流程规范</h4><p style="font-size:24px;font-weight:800;color:var(--primary);">${result.process||0}<span style="font-size:14px;color:var(--text-secondary);">/${scene.type==='opening'?40:30}</span></p></div>
      <div class="eval-dim"><h4>要点准确</h4><p style="font-size:24px;font-weight:800;color:var(--primary);">${result.accuracy||0}<span style="font-size:14px;color:var(--text-secondary);">/30</span></p></div>
      <div class="eval-dim"><h4>亲和力</h4><p style="font-size:24px;font-weight:800;color:var(--primary);">${result.rapport||0}<span style="font-size:14px;color:var(--text-secondary);">/30</span></p></div>
      ${scene.type !== 'opening' ? `<div class="eval-dim"><h4>覆盖度</h4><p style="font-size:24px;font-weight:800;color:var(--accent);">${result.coverage||0}<span style="font-size:14px;color:var(--text-secondary);">/10</span></p></div>` : ''}
    </div>
    <div style="margin-top:16px;font-size:13px;color:var(--text-secondary);">📝 共 ${drillExchangeCount} 轮对话</div>
    <div style="margin-top:16px;padding:16px;background:#f8fafc;border-radius:10px;border-left:4px solid var(--primary);"><strong>📋 AI 评语：</strong><p style="margin-top:6px;line-height:1.8;">${result.feedback || ''}</p>
      ${(result.strengths && result.strengths.length) ? `<p style="margin-top:10px;"><strong>✅ 优点：</strong>${result.strengths.map(s=>`<span style="display:inline-block;background:#dcfce7;padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0;font-size:12px;">${s}</span>`).join('')}</p>` : ''}
      ${(result.improvements && result.improvements.length) ? `<p style="margin-top:10px;"><strong>💡 改进方向：</strong>${result.improvements.map(s=>`<span style="display:inline-block;background:#fef3c7;padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0;font-size:12px;">${s}</span>`).join('')}</p>` : ''}
    </div>
    <div style="margin-top:20px;padding-top:16px;border-top:2px dashed var(--border);text-align:center;">
      <button class="btn" onclick="resetDrillScene()" style="min-width:180px;">🔄 重做本关</button>
      ${drillSceneDone[drillCurrentScene] && drillCurrentScene < 5 ? `<button class="btn btn-success" onclick="switchDrillScene(${drillCurrentScene+1})" style="min-width:180px;margin-left:10px;">下一关 →</button>` : ''}
    </div>`;
  const fb = document.getElementById('drillFeedback');
  if (fb) { fb.innerHTML = html; fb.style.display = 'block'; }
}

// 重做当前场景
function resetDrillScene() {
  drillSceneDone[drillCurrentScene] = false;
  drillSceneScores[drillCurrentScene] = 0;
  drillExchangeCount = 0;
  drillConversation = [];
  const input = document.getElementById('drillInput');
  if (input) { input.value = ''; input.disabled = true; input.placeholder = '点击「开始练习」后输入你的话...'; }

  document.getElementById('drillSendBtn').style.display = 'none';

// 切换场景（仅已解锁）
function switchDrillScene(idx) {
  if (idx < 0 || idx > 5) return;
  if (idx > 0 && !drillSceneDone[idx-1]) {
    if (typeof showToast === 'function') showToast('🔒 请先完成第' + idx + '关（' + drillScenes[idx-1].label + '）', 'warning');
    return;
  }
  drillCurrentScene = idx;
  drillExchangeCount = 0;
  drillConversation = [];
  const input = document.getElementById('drillInput');
  if (input) { input.value = ''; input.disabled = true; input.placeholder = '点击「开始练习」后输入你的话...'; }
  document.getElementById('drillStartBtn').style.display = '';
  document.getElementById('drillSendBtn').style.display = 'none';
  document.getElementById('drillEndBtn').style.display = 'none';
  const content = document.getElementById('drillInputRow');
  if (content) content.style.display = '';
  const fb = document.getElementById('drillFeedback');
  if (fb) { fb.innerHTML = ''; fb.style.display = 'none'; }
  const chat = document.getElementById('drillChatArea');
  if (chat) chat.innerHTML = `<div style="text-align:center;color:var(--text-secondary);padding:20px;font-size:13px;">👇 点击「开始练习」进入：${drillScenes[idx].label}</div>`;
  updateDrillUI();
  if (typeof saveProgress === 'function') saveProgress();
}

// 提交全部对话记录进行综合考核评分
async function submitDrillAssessment() {
  if (!drillSceneDone.every(d => d)) {
    if (typeof showToast === 'function') showToast('⚠️ 请先完成全部 6 关练习', 'warning');
    return;
  }
  const btn = document.getElementById('drillSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ AI 综合评分中...'; }
  if (typeof showToast === 'function') showToast('📊 正在分析你全部 6 关的对话表现...', 'info');
  try {
    const allText = drillScenes.map((s, i) => {
      const conv = (drillSceneConversations[i] || []).map(m => `${m.role === 'user' ? '🧑‍🏫 CC' : '👩 AI家长'}：${m.content}`).join('\n');
      return `【第${i+1}关：${s.label}】\n${conv}`;
    }).join('\n\n');
    const evalMessages = [
      { role: 'system', content: `你是VIP THINK培训机构的资深教学评审官，对CC学员在「开场白与异议处理」全部6个场景练习中的整体表现进行综合考核评分。

【6个场景】
1. 开场白：三步法（表明身份/来电目的/让家长感觉有帮助）
2. 异议处理·没时间：理解+线上省时+40分钟+二选一
3. 异议处理·小朋友不喜欢：理解+回顾初心+引导型老师
4. 异议处理·报其他班了：不贬低+免费+108课纲贴合+检验效果
5. 异议处理·没有领课：试听=测评课+全方位评估
6. 异议处理·其他理由：尊重+零成本体验+体验后更有依据

【评分标准】（满分100分）
1. 流程规范性（30分）：各场景是否按「理解→价值→引导→坚持，不展开」执行
2. 异议处理质量（30分）：五大拒绝理由是否逐一覆盖且化解到位
3. 服务亲和力（30分）：语气、共情、不施压
4. 话题覆盖度（10分）：是否覆盖必要话题

【评分规则】
- 70分为及格线
- 对话质量 > 对话长度
- 识别关键词而非字面对照
- 具体指出优点和改进方向

【输出格式要求 — 极其严格】
必须且只能输出以下 JSON 格式，不要加任何其他文字、解释、markdown 标记：
{"score":85,"process":25,"accuracy":25,"rapport":27,"coverage":8,"feedback":"整体评语","strengths":["优点1","优点2"],"improvements":["改进建议1","改进建议2"]}` },
      { role: 'user', content: `以下是学员全部6个场景的对话记录，请进行综合评分：\n\n${allText}` }
    ];
    const data = await callDeepSeek({ messages: evalMessages, model: DEEPSEEK_MODEL, max_tokens: 500, temperature: 0.3 });
    const rawText = data.choices?.[0]?.message?.content?.trim() || '';
    let result;
    try {
      const jsonMatch = rawText.match(/\{[\s\S]*\}/);
      result = JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
    } catch (e) {
      console.warn('AI综合评分JSON解析失败，原始返回:', rawText);
      result = { score: 60, process: 18, accuracy: 16, rapport: 17, coverage: 9, feedback: 'AI 综合评分解析出现问题，已给予基础分数。建议重新提交。', strengths: ['完成了全部练习'], improvements: ['可再详细一些'] };
    }
    drillAssessmentScore = Math.min(Math.max(result.score || 0, 0), 100);
    drillAssessmentSubmitted = true;
    renderDrillAssessment(result);
    updateDrillUI();
    updateSidebarLocks();
    if (typeof saveProgress === 'function') saveProgress();
    if (typeof showToast === 'function') showToast('综合考核得分：' + drillAssessmentScore + ' 分' + (drillIsPassed() ? '，已解锁下一章！' : '，未达标可重做后重新提交'), drillIsPassed() ? 'success' : 'warning');
  } catch (err) {
    console.error('综合评分失败:', err);
    if (typeof showToast === 'function') showToast('❌ 综合评分失败：' + err.message + '，请重试', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '📤 提交对话记录进行综合考核'; }
  }
}

function renderDrillAssessment(result) {
  const area = document.getElementById('drillAssessmentArea');
  if (!area) return;
  const score = drillAssessmentScore;
  const pass = drillIsPassed();
  const scoreClass = score >= 80 ? 'high' : score >= 70 ? 'medium' : 'low';
  const scoreLabel = score >= 80 ? '优秀' : score >= 70 ? '通过' : '未通过';
  area.innerHTML = `
    <div class="score-display"><div class="score-circle ${scoreClass}" style="width:80px;height:80px;font-size:32px;">${score}</div><p style="margin-top:8px;font-size:16px;font-weight:700;">综合考核：${scoreLabel}（满分100分）</p><p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${pass ? '✅ 综合≥' + DRILL_PASS_SCORE + '分，第3章已解锁！' : '❌ 综合未达' + DRILL_PASS_SCORE + '分，可重做关卡后重新提交'}</p></div>
    <div class="eval-dimensions" style="margin-top:20px;">
      <div class="eval-dim"><h4>流程规范</h4><p style="font-size:24px;font-weight:800;color:var(--primary);">${result.process||0}<span style="font-size:14px;color:var(--text-secondary);">/30</span></p></div>
      <div class="eval-dim"><h4>异议处理</h4><p style="font-size:24px;font-weight:800;color:var(--primary);">${result.accuracy||0}<span style="font-size:14px;color:var(--text-secondary);">/30</span></p></div>
      <div class="eval-dim"><h4>亲和力</h4><p style="font-size:24px;font-weight:800;color:var(--primary);">${result.rapport||0}<span style="font-size:14px;color:var(--text-secondary);">/30</span></p></div>
      <div class="eval-dim"><h4>覆盖度</h4><p style="font-size:24px;font-weight:800;color:var(--accent);">${result.coverage||0}<span style="font-size:14px;color:var(--text-secondary);">/10</span></p></div>
    </div>
    <div style="margin-top:16px;padding:16px;background:#f8fafc;border-radius:10px;border-left:4px solid var(--primary);"><strong>📋 AI 评语：</strong><p style="margin-top:6px;line-height:1.8;">${result.feedback || ''}</p>
      ${(result.strengths && result.strengths.length) ? `<p style="margin-top:10px;"><strong>✅ 优点：</strong>${result.strengths.map(s=>`<span style="display:inline-block;background:#dcfce7;padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0;font-size:12px;">${s}</span>`).join('')}</p>` : ''}
      ${(result.improvements && result.improvements.length) ? `<p style="margin-top:10px;"><strong>💡 改进方向：</strong>${result.improvements.map(s=>`<span style="display:inline-block;background:#fef3c7;padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0;font-size:12px;">${s}</span>`).join('')}</p>` : ''}
    </div>
    <div style="margin-top:20px;text-align:center;"><button class="btn" onclick="resetDrillScene()" style="min-width:180px;">🔄 重做关卡后重新提交</button></div>`;
}

// Keyboard// Keyboard
function setupQuizListeners() {
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      const fi = document.getElementById('rpInput');
      if (fi && document.activeElement === fi && !fi.disabled) submitRoleplayMessage();
    }
  });
}

// Timer
function startTimer() {
  const saved = localStorage.getItem(LS_PREFIX+'_study_seconds');
  if (saved) studySeconds = parseInt(saved);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    studySeconds++;
    updateTimerDisplay();
    if (studySeconds % 10 === 0) localStorage.setItem(LS_PREFIX+'_study_seconds', studySeconds);
  }, 1000);
}
function updateTimerDisplay() {
  const mins = Math.floor(studySeconds/60), secs = studySeconds%60;
  const ts = String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  const el = document.getElementById('timerDisplay'); if (el) el.textContent = ts;
  const mt = document.getElementById('mhTimer'); if (mt) mt.textContent = '⏱ '+ts;
}

// Notes
function toggleNotes() { document.getElementById('notesPanel').classList.toggle('open'); }
function updateNotesForSection(index) {
  document.getElementById('notesChapterLabel').textContent = courseData.sections[index].title;
  const saved = JSON.parse(localStorage.getItem(LS_PREFIX+'_notes')||'{}');
  document.getElementById('notesTextarea').value = saved[index]||'';
}
function loadNotes() {
  const saved = JSON.parse(localStorage.getItem(LS_PREFIX+'_notes')||'{}');
  const ta = document.getElementById('notesTextarea');
  if (ta) {
    ta.value = saved[currentSection]||'';
    ta.addEventListener('input', function() {
      const all = JSON.parse(localStorage.getItem(LS_PREFIX+'_notes')||'{}');
      all[currentSection] = this.value;
      localStorage.setItem(LS_PREFIX+'_notes', JSON.stringify(all));
    });
  }
}

// Progress persistence
function saveProgress() {
  const state = { completedSections: [...completedSections], chapterQuizDone, chapterQuizAnswers, finalTaskSubmitted, finalScore, roleplaySubmitted, roleplayScore, roleplayExchangeCount, roleplayConversation, drillCurrentScene, drillSceneDone, drillSceneScores, drillExchangeCount, drillConversation, drillSceneConversations, drillAssessmentSubmitted, drillAssessmentScore, currentSection };
  localStorage.setItem(LS_PREFIX+'_progress', JSON.stringify(state));
}
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_PREFIX+'_progress'));
    if (saved) {
      completedSections = new Set(saved.completedSections||[]);
      chapterQuizDone = saved.chapterQuizDone || [false,false,false,false,false,false];
      // 旧数据迁移：chapterQuizDone 有 true 但无 chapterQuizAnswers → 重置
      if (chapterQuizDone.some(d => d) && (!saved.chapterQuizAnswers || Object.keys(saved.chapterQuizAnswers).length === 0)) {
        chapterQuizDone = [false,false,false,false,false,false];
      }
      if (saved.chapterQuizAnswers) Object.assign(chapterQuizAnswers, saved.chapterQuizAnswers);
      finalTaskSubmitted = saved.finalTaskSubmitted||false; finalScore = saved.finalScore||0;
      roleplaySubmitted = saved.roleplaySubmitted || finalTaskSubmitted || false;
      roleplayScore = saved.roleplayScore || finalScore || 0;
      roleplayExchangeCount = saved.roleplayExchangeCount || 0;
      roleplayConversation = saved.roleplayConversation || [];
      drillCurrentScene = saved.drillCurrentScene || 0;
      drillSceneDone = saved.drillSceneDone || [false,false,false,false,false,false];
      drillSceneScores = saved.drillSceneScores || [0,0,0,0,0,0];
      drillExchangeCount = saved.drillExchangeCount || 0;
      drillConversation = saved.drillConversation || [];
      drillSceneConversations = saved.drillSceneConversations || [[],[],[],[],[],[]];
      drillAssessmentSubmitted = saved.drillAssessmentSubmitted || false;
      drillAssessmentScore = saved.drillAssessmentScore || 0;
      if (saved.currentSection !== undefined) currentSection = saved.currentSection;
      // 验证 currentSection 可达性
      const navCheck = canNavigateTo(currentSection);
      if (!navCheck.ok) currentSection = 0;
      updateProgress(); updateSidebarLocks();
      // 恢复章节选择题 UI
      restoreChapterQuizUI();
      if (roleplaySubmitted) {
        // 嘗試恢復反饋區域（如果有）
        const fb = document.getElementById('rpFeedback');
        if (fb && roleplayScore) {
          // 用基本資料重建反饋（不重建 JSON 細節，僅顯示分數與重做按鈕）
          const scoreClass = roleplayScore >= 80 ? 'high' : roleplayScore >= 60 ? 'medium' : 'low';
          const scoreLabel = roleplayScore >= 80 ? '優秀' : roleplayScore >= 60 ? '通過' : '未通過';
          fb.innerHTML = `<div class="score-display"><div class="score-circle ${scoreClass}" style="width:80px;height:80px;font-size:32px;">${roleplayScore}</div><p style="margin-top:8px;font-size:16px;font-weight:700;">${scoreLabel}（滿分100分）</p><p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">（历史记录已载入，可重新作答覆盖）</p></div><div style="margin-top:20px;text-align:center;"><button class="btn" onclick="resetRoleplay()" style="min-width:180px;">🔄 重新作答</button></div>`;
          fb.style.display = 'block';
          const content = document.getElementById('rpContent');
          if (content) content.style.display = 'none';
        }
      }
      // 导航到上次所在章节
      navigateTo(currentSection);
      // 恢复 AI 对话模拟练习 UI（进度条/标注/综合考核区）
      if (typeof updateDrillUI === 'function') updateDrillUI();
    } else {
      navigateTo(0);
    }
  } catch(e) {
    navigateTo(0);
  }
}

// Certificate
function checkCertificate() {
  const allDone = completedSections.size >= courseData.sections.length && finalTaskSubmitted && finalScore >= 60;
  if (allDone) {
    setTimeout(() => {
      showToast('🏆 恭喜完成全部课程！点击领取结业证书', 'success');
      document.getElementById('certStudentName').textContent = '请填写姓名';
      document.getElementById('certScore').textContent = '综合评定：通过';
      document.getElementById('certFinalScore').textContent = '终极考核得分：'+finalScore+' 分';
      document.getElementById('certDate').textContent = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
      document.getElementById('certOverlay').style.display = 'flex';
    }, 1000);
  }
}
function closeCertificate() { document.getElementById('certOverlay').style.display = 'none'; }
function printCertificate() {
  const cert = document.getElementById('certPaper');
  const win = window.open('','_blank','width=750,height=600');
  win.document.write('<html><head><meta charset="UTF-8"><title>结业证书</title><style>');
  win.document.write('body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f1f5f9;}');
  win.document.write('.cert{background:#fff;width:700px;padding:48px 36px;text-align:center;border:2px solid #e2e8f0;border-radius:12px;}');
  win.document.write('.cert h1{font-size:28px;color:#3730A3;margin-bottom:4px;}');
  win.document.write('.cert .sub{font-size:12px;color:#64748b;letter-spacing:0.1em;margin-bottom:24px;}');
  win.document.write('.cert .body{font-size:15px;line-height:2;color:#1e293b;}');
  win.document.write('.cert .name{display:inline-block;border-bottom:2px solid #4F46E5;min-width:120px;padding:4px 12px;margin:0 4px;}');
  win.document.write('.cert .course{font-weight:700;color:#3730A3;margin:8px 0;}');
  win.document.write('.cert .score{margin:20px 0 4px;font-size:16px;font-weight:600;color:#10b981;}');
  win.document.write('.cert .final-score{margin:4px 0 20px;font-size:14px;font-weight:600;color:#3730A3;}');
  win.document.write('.cert .footer{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-top:32px;border-top:1px solid #e2e8f0;padding-top:16px;}');
  win.document.write('</style></head><body><div class="cert">');
  win.document.write(cert.innerHTML.replace(/<button[^>]*>.*?<\/button>/g,''));
  win.document.write('</div></body></html>');
  win.document.close(); setTimeout(() => win.print(), 500);
}

// Tab switching
function switchTab(btn, panelId) {
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  btn.parentElement.parentElement.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(panelId).classList.add('active');
}

// Toast & Sidebar
function showToast(msg, type) {
  const existing = document.querySelector('.toast'); if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast '+type; toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
document.addEventListener('DOMContentLoaded', init);
</script>
